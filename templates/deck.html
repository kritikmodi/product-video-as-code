<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer deck</title>
<!--
  A starter deck for the explainer-video pipeline.

  The renderer drives this by calling window.__seek(t) once per frame, so the
  timeline must be a pure function of t. Never use requestAnimationFrame or CSS
  animation playback for anything that has to appear in the render.

  Contract with the pipeline:
    window.__total     total seconds
    window.__scenes    [{i, start, dur}]
    window.__retime(d) apply measured durations from timings.json
    window.__seek(t)   paint the frame at time t
    window.__overlays  [{scene, at, rect}] for composite.py (optional)

  Swap the palette, type and scene builders freely - the engine below is the part
  worth keeping.
-->
<style>
  :root{
    /* replace with your brand */
    --ink:#0B1014;
    --fg:#E8EDEF;
    --muted:rgba(232,237,239,.60);
    --faint:rgba(232,237,239,.30);
    --line:rgba(255,255,255,.09);
    --accent:#3BCEAC;
    --accent-2:#5EA9FF;
    --warn:#FFD23F;
    --sans:"SF Pro Display",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink)}
  body{font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased}

  #bg{position:fixed;inset:0;background:var(--ink);overflow:hidden}
  #bg .glow{position:absolute;width:1100px;height:1100px;left:-300px;top:420px;
    border-radius:50%;filter:blur(140px);
    background:radial-gradient(circle,rgba(59,206,172,.16),transparent 66%)}
  #bg .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse 96% 82% at 50% 48%,transparent 42%,rgba(0,0,0,.6))}

  #stage{position:fixed;inset:0}
  .scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
         flex-direction:column;will-change:opacity,transform;transform-origin:50% 50%}
  .scene.on{display:flex}
  .wrap{width:1520px;display:flex;flex-direction:column;align-items:center;text-align:center}

  h1{font-size:94px;line-height:1.04;font-weight:800;letter-spacing:-.035em}
  h1.sm{font-size:80px}
  .ln{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
  .ln>span{display:inline-block}
  .grad{background:linear-gradient(96deg,var(--accent-2),var(--accent));
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:30px;line-height:1.5;color:var(--muted);max-width:1080px;margin-top:34px}
  .sub b{color:#fff;font-weight:640}
  .kick{font-size:26px;color:var(--faint);margin-top:44px}
  .kick b{color:#fff;font-weight:640}

  .row{display:flex;gap:22px;justify-content:center;margin-top:60px}
  .chip{display:flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;
        border:1px solid var(--line);background:rgba(255,255,255,.04);
        font-size:23px;font-weight:600;white-space:nowrap}

  /* Footage frame. The .screen rect is what composite.py measures and overlays
     into, so scenes using it must not drift (see noDrift below). */
  .pframe{position:absolute;left:240px;top:115px;width:1440px;border-radius:13px;
          overflow:hidden;border:1px solid rgba(255,255,255,.16);opacity:0;
          box-shadow:0 50px 120px -40px rgba(0,0,0,1)}
  .pframe .chrome{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;
                  background:#151A24;border-bottom:1px solid var(--line)}
  .pframe .chrome i{width:11px;height:11px;border-radius:50%;display:block}
  .pframe .screen{width:1440px;height:810px;background:#000;display:block}
</style>
</head>
<body>
<div id="bg"><div class="glow"></div><div class="vig"></div></div>
<div id="stage"></div>

<script>
/* ============================ helpers ============================ */
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function H(lines,cls){
  const h=el('h1',cls||'');
  lines.forEach(L=>{
    const ln=el('div','ln'), s=el('span','w');
    s.innerHTML=L.t; if(L.g)s.classList.add('grad');
    ln.appendChild(s); h.appendChild(ln);
  });
  return h;
}
function pframe(){
  const f=el('div','pframe');
  f.appendChild(el('div','chrome',
    '<i style="background:#ff5f57"></i><i style="background:#febc2e"></i>'+
    '<i style="background:#28c840"></i>'));
  f.appendChild(el('div','screen'));
  return f;
}

/* ============================ scenes ============================
   scene(fallbackDuration, build, animations, options)

   Durations here are only fallbacks - timings.json, measured from the real
   narration, overrides them at render time.

   Animation props: o opacity, x/y translate, s scale, sx scaleX, b blur,
   n number (counts), clip left-to-right wipe, type per-line typing,
   dash SVG path draw, travel dot along a connector.
   ================================================================ */
const SCENES=[];
const PFRAME_HOST=[];
function scene(dur,build,anims,opts){SCENES.push({dur,build,anims,opts:opts||{}});}

scene(6,w=>{
  w.appendChild(H([{t:'Your headline here'},{t:'with the point in accent.',g:1}]));
  w.appendChild(el('div','sub','A supporting line that earns its place.'));
},[
  {sel:'.ln .w',at:.15,dur:.9,from:{o:0,y:70},to:{o:1,y:0},stagger:.12},
  {sel:'.sub',at:1.6,dur:.9,from:{o:0,y:20},to:{o:1,y:0}},
]);

scene(7,w=>{
  w.appendChild(H([{t:'Three things.'}],'sm'));
  const r=el('div','row');
  ['First','Second','Third'].forEach(t=>r.appendChild(el('div','chip','<span>'+t+'</span>')));
  w.appendChild(r);
  w.appendChild(el('div','kick','Each chip lands on its own narrated beat.'));
},[
  {sel:'.ln .w',at:.15,dur:.8,from:{o:0,y:56},to:{o:1,y:0}},
  {sel:'.chip',at:1.8,dur:.6,from:{o:0,y:22,s:.92},to:{o:1,y:0,s:1},stagger:1.1},
  {sel:'.kick',at:5.2,dur:.7,from:{o:0,y:18},to:{o:1,y:0}},
]);

/* A scene carrying recorded footage. noDrift keeps the frame pixel-fixed so the
   ffmpeg overlay cannot slide off it; footage is the local time the clip starts. */
scene(10,w=>{
  w.appendChild(H([{t:'And here is the real thing.'}],'sm'));
  PFRAME_HOST.push(w);
},[
  {sel:'.ln .w',at:.15,dur:.8,from:{o:0,y:56},to:{o:1,y:0}},
  {sel:'.ln .w',at:2.4,dur:.5,from:{o:1,y:0},to:{o:0,y:-26},ease:'outCubic'},
  {sel:'.pframe',at:2.9,dur:.5,from:{o:0},to:{o:1},ease:'outCubic'},
  {sel:'.pframe',at:9.2,dur:.5,from:{o:1},to:{o:0},ease:'outCubic'},
],{noDrift:1,footage:3.3});

/* ============================ engine ============================ */
const EASE={
  linear:p=>p,
  outExpo:p=>p>=1?1:1-Math.pow(2,-10*p),
  outCubic:p=>1-Math.pow(1-p,3),
  outBack:p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);},
  inOutCubic:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
};
const OVERLAP=0.45;
const stage=document.getElementById('stage');
let acc=0;
SCENES.forEach(sc=>{
  const s=el('section','scene'), w=el('div','wrap');
  s.appendChild(w);
  const before=PFRAME_HOST.length;
  sc.build(w);
  if(PFRAME_HOST.length>before){ s.appendChild(pframe()); PFRAME_HOST.length=before; }
  stage.appendChild(s);
  sc.el=s; sc.start=acc; sc.end=acc+sc.dur; acc+=sc.dur;
  sc.tl=[];
  (sc.anims||[]).forEach(a=>{
    [...s.querySelectorAll(a.sel)].forEach((n,k)=>{
      // Only the FIRST entry for an element may paint before its own start time.
      // Without this, a later entry (a fade-out, say) clamps to its `from` value
      // from frame zero and overrides the entry that should be in charge.
      const primary=!sc.tl.some(e=>e.el===n);
      sc.tl.push({el:n,at:a.at+(a.stagger||0)*k,dur:a.dur,from:a.from,to:a.to,
                  primary,ease:EASE[a.ease||'outExpo']});
      if(a.to.dash!=null && n.getTotalLength){const L=n.getTotalLength();n.style.strokeDasharray=L;n._len=L;}
    });
  });
});

function applyProps(n,v){
  const tr=[];
  if(v.x!=null||v.y!=null)tr.push(`translate(${v.x||0}px,${v.y||0}px)`);
  if(v.s!=null)tr.push(`scale(${v.s})`);
  if(v.sx!=null)tr.push(`scaleX(${v.sx})`);
  if(tr.length)n.style.transform=tr.join(' ');
  if(v.o!=null)n.style.opacity=v.o;
  if(v.b!=null)n.style.filter=v.b>0.02?`blur(${v.b}px)`:'none';
  if(v.n!=null)n.textContent=Math.round(v.n);
  if(v.dash!=null)n.style.strokeDashoffset=n._len*(1-v.dash);
  if(v.clip!=null)n.style.clipPath=`inset(0 ${Math.max(0,(1-v.clip)*100)}% 0 0)`;
  if(v.travel!=null){
    const w=n.parentElement.offsetWidth||70, p=(v.travel*3)%1;
    n.style.transform=`translateX(${p*(w-8)}px)`;
    n.style.opacity=Math.max(0,Math.min(p/.12,1)*Math.min((1-p)/.12,1));
  }
  if(v.type!=null){   // reveal a line left-to-right, keeping syntax highlighting
    const total=n.textContent.length||1, shown=Math.round(v.type*total);
    n.style.clipPath=`inset(0 ${Math.max(0,(1-shown/total)*100)}% 0 0)`;
    n.style.opacity=shown>0?1:0;
  }
}

function seek(t){
  SCENES.forEach(sc=>{
    const vis = t>=sc.start-OVERLAP && t<sc.end+0.02;
    sc.el.classList.toggle('on',vis);
    if(!vis)return;
    let a=1,z=1;
    if(t<sc.start+0.18){
      const p=EASE.outCubic(Math.min(1,Math.max(0,(t-(sc.start-OVERLAP))/(OVERLAP+0.18))));
      a=p; z=1.035-0.035*p;
    }
    if(t>sc.end-OVERLAP){
      const p=EASE.inOutCubic(Math.min(1,(t-(sc.end-OVERLAP))/OVERLAP));
      a=Math.min(a,1-p); z=0.985+0.015*(1-p);
    }
    const g=(t-sc.start)/sc.dur;
    sc.el.style.opacity=a;
    sc.el.style.transform = sc.opts.noDrift ? 'none' : `scale(${z*(1+0.012*g)})`;
    const lt=t-sc.start;
    sc.tl.forEach(e=>{
      if(!e.primary && lt<e.at) return;
      const p=e.ease(Math.min(1,Math.max(0,(lt-e.at)/e.dur)));
      const v={};
      for(const k in e.to){const f=e.from[k]!=null?e.from[k]:0;v[k]=f+(e.to[k]-f)*p;}
      applyProps(e.el,v);
    });
  });
}

function publish(){
  window.__total=SCENES[SCENES.length-1].end;
  window.__scenes=SCENES.map((s,i)=>({i:i+1,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2)}));
  window.__overlays=SCENES.map((s,i)=>s.opts.footage==null?null:
      ({scene:i+1,at:+(s.start+s.opts.footage).toFixed(3)})).filter(Boolean);
}
window.__retime=function(durs){
  let a=0;
  SCENES.forEach((sc,i)=>{ if(durs[i]!=null)sc.dur=durs[i]; sc.start=a; sc.end=a+sc.dur; a+=sc.dur; });
  publish();
};
window.__seek=seek;
publish();
seek(0);
</script>
</body>
</html>
